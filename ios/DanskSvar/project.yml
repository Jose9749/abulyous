name: DanskSvar
options:
  bundleIdPrefix: dk.privat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Sæt dit eget Apple-team-ID her (Xcode > Settings > Accounts), eller vælg
    # teamet i Signing & Capabilities efter at projektet er genereret.
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"          # 1 = kun iPhone. Appen kan ikke installeres på iPad/Mac.
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DanskSvar:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.privat.dansksvar
        PRODUCT_NAME: DanskSvar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DanskSvar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64, microphone]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Holder lydsessionen i live, når appen er i baggrunden eller telefonen er låst.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          DanskSvar skal bruge mikrofonen for at kunne genkende dansk tale i rummet.
          Uden mikrofonadgang kan appen ikke registrere, hvad der bliver sagt.
        NSSpeechRecognitionUsageDescription: >-
          DanskSvar omsætter dansk tale til tekst, så appen kan finde den røde tråd
          i samtalen og formulere et skriftligt svar til din låseskærm.

schemes:
  DanskSvar:
    build:
      targets:
        DanskSvar: all
    run:
      config: Debug
    archive:
      config: Release
