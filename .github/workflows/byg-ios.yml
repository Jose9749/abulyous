name: Byg DanskSvar

# Bygger appen på en rigtig macOS-maskine og lægger en usigneret .ipa frem.
# Formålet er dobbelt: at fange oversætterfejl, og at give en fil, der kan
# sideloades på en iPhone uden en Mac.

on:
  push:
    paths:
      - "ios/DanskSvar/**"
      - ".github/workflows/byg-ios.yml"
  workflow_dispatch:

jobs:
  byg:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Vis valgt Xcode
        run: xcodebuild -version

      - name: Installér XcodeGen
        run: brew install xcodegen

      - name: Generér Xcode-projektet
        working-directory: ios/DanskSvar
        run: xcodegen generate

      - name: Oversæt appen
        working-directory: ios/DanskSvar
        run: |
          set -o pipefail
          xcodebuild \
            -project DanskSvar.xcodeproj \
            -scheme DanskSvar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Pak til .ipa
        working-directory: ios/DanskSvar
        run: |
          APP="build/Build/Products/Release-iphoneos/DanskSvar.app"
          test -d "$APP" || { echo "Fandt ikke $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DanskSvar-usigneret.ipa Payload
          ls -lh DanskSvar-usigneret.ipa

      - name: Læg .ipa frem til download
        uses: actions/upload-artifact@v4
        with:
          name: DanskSvar-usigneret-ipa
          path: ios/DanskSvar/DanskSvar-usigneret.ipa
          retention-days: 30
